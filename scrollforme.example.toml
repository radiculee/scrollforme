# Copy to scrollforme.toml (git-ignored) and edit.

# Where run folders (digest.json + digest.html) are written.
output_dir = "output"

# Folder of per-website modules (modules/reddit.com, modules/instagram.com, ...).
modules_dir = "modules"

[browser]
# A dedicated Chrome profile. Log in to each site once with `scrollforme login`.
profile_dir = "profile"
# Windows: "C:/Program Files/Google/Chrome/Application/chrome.exe"
chrome_binary = "google-chrome"
headless = false

[mcp]
# How to start stealth-browser-mcp (https://github.com/vibheksoni/stealth-browser-mcp).
# Windows venvs keep Python at .venv/Scripts/python.exe instead of .venv/bin/python.
command = "~/.local/src/stealth-browser-mcp/.venv/bin/python"
args = ["~/.local/src/stealth-browser-mcp/src/server.py"]

[agent]
model = "claude-opus-5-5"
effort = "medium"
max_turns = 60          # per site visit
max_budget_usd = 1.0    # per site visit

# One entry per site visit. `module` names a folder in modules_dir; `description`
# says, in your own words, what you use that site for. Its browse() gets it verbatim.
[[sources]]
module = "reddit.com"
description = """My home feed: the top of what the subreddits I follow are posting right now,
so I can catch up without scrolling."""
